<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siman NFT 管理平台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .sidebar-transition {
            transition: all 0.3s ease-in-out;
        }
        .content-transition {
            transition: margin-left 0.3s ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-hover {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 侧边栏 -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg sidebar-transition transform -translate-x-full lg:translate-x-0">
        <div class="flex items-center justify-center h-16 bg-gradient-to-r from-purple-600 to-blue-600">
            <h1 class="text-white text-xl font-bold">Siman NFT 管理</h1>
        </div>
        
        <nav class="mt-8">
            <div class="px-4 space-y-2">
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="dashboard">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    仪表板
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="products">
                    <i class="fas fa-box mr-3"></i>
                    商品管理
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="inventory">
                    <i class="fas fa-warehouse mr-3"></i>
                    仓库管理
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="orders">
                    <i class="fas fa-shopping-cart mr-3"></i>
                    订单管理
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="users">
                    <i class="fas fa-users mr-3"></i>
                    用户管理
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="analytics">
                    <i class="fas fa-chart-bar mr-3"></i>
                    数据分析
                </a>
                <a href="#" class="nav-item flex items-center px-4 py-2 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" data-page="settings">
                    <i class="fas fa-cog mr-3"></i>
                    系统设置
                </a>
            </div>
        </nav>
        
        <div class="absolute bottom-0 w-full p-4">
            <button id="logoutBtn" class="w-full flex items-center px-4 py-2 text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                <i class="fas fa-sign-out-alt mr-3"></i>
                退出登录
            </button>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div id="main-content" class="content-transition lg:ml-64">
        <!-- 顶部导航栏 -->
        <header class="bg-white shadow-sm border-b">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center">
                    <button id="sidebarToggle" class="lg:hidden text-gray-600 hover:text-gray-900">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 id="pageTitle" class="ml-4 text-2xl font-semibold text-gray-800">仪表板</h2>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- 通知 -->
                    <div class="relative">
                        <button class="text-gray-600 hover:text-gray-900">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
                        </button>
                    </div>
                    
                    <!-- 用户菜单 -->
                    <div class="relative">
                        <button id="userMenuBtn" class="flex items-center space-x-2 text-gray-700 hover:text-gray-900">
                            <img src="https://via.placeholder.com/32x32" alt="用户头像" class="w-8 h-8 rounded-full">
                            <span class="hidden md:block">管理员</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">个人资料</a>
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">设置</a>
                            <hr class="my-1">
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 页面内容 -->
        <main class="p-6">
            <!-- 仪表板页面 -->
            <div id="dashboard-page" class="page-content fade-in">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <!-- 统计卡片 -->
                    <div class="bg-white rounded-lg shadow p-6 card-hover">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                                <i class="fas fa-box text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">总商品数</p>
                                <p class="text-2xl font-semibold text-gray-900">156</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6 card-hover">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-green-100 text-green-600">
                                <i class="fas fa-shopping-cart text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">总订单数</p>
                                <p class="text-2xl font-semibold text-gray-900">1,234</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6 card-hover">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                                <i class="fas fa-users text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">总用户数</p>
                                <p class="text-2xl font-semibold text-gray-900">5,678</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6 card-hover">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                                <i class="fas fa-dollar-sign text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">总收入</p>
                                <p class="text-2xl font-semibold text-gray-900">¥89,012</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 图表区域 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">销售趋势</h3>
                        <div class="h-64 bg-gray-100 rounded flex items-center justify-center">
                            <p class="text-gray-500">图表占位符</p>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">热门商品</h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">希漫红酒</span>
                                <span class="text-sm font-medium text-gray-900">156 件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">希漫威士忌</span>
                                <span class="text-sm font-medium text-gray-900">89 件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">希漫白酒</span>
                                <span class="text-sm font-medium text-gray-900">67 件</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 其他页面内容将在这里动态加载 -->
            <div id="products-page" class="page-content hidden">
                <!-- 商品管理页面内容 -->
            </div>
            
            <div id="inventory-page" class="page-content hidden">
                <!-- 仓库管理页面内容 -->
            </div>
            
            <div id="orders-page" class="page-content hidden">
                <!-- 订单管理页面内容 -->
            </div>
            
            <div id="users-page" class="page-content hidden">
                <!-- 用户管理页面内容 -->
            </div>
            
            <div id="analytics-page" class="page-content hidden">
                <!-- 数据分析页面内容 -->
            </div>
            
            <div id="settings-page" class="page-content hidden">
                <!-- 系统设置页面内容 -->
            </div>
        </main>
    </div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg font-medium text-gray-900 mb-4">管理员登录</h3>
                
                <!-- 登录表单 -->
                <form id="loginForm" class="space-y-4">
                    <div>
                        <input type="email" id="email" placeholder="邮箱地址" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <input type="password" id="password" placeholder="密码" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-600">记住我</span>
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:text-blue-500">忘记密码？</a>
                    </div>
                    <button type="submit" 
                            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        登录
                    </button>
                </form>
                
                <!-- 第三方登录 -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">或使用</span>
                        </div>
                    </div>
                    
                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <i class="fab fa-google text-red-500 mr-2"></i>
                            Google
                        </button>
                        <button class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <i class="fab fa-github text-gray-900 mr-2"></i>
                            GitHub
                        </button>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-sm text-gray-600">
                        还没有账户？ <a href="#" class="text-blue-600 hover:text-blue-500">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 'dashboard';
        let isLoggedIn = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initEventListeners();
            loadPage('dashboard');
        });

        // 检查认证状态
        function checkAuth() {
            const token = localStorage.getItem('admin_token');
            if (token) {
                isLoggedIn = true;
                document.getElementById('loginModal').classList.add('hidden');
            } else {
                isLoggedIn = false;
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 侧边栏切换
            document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
            
            // 导航菜单
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    loadPage(page);
                });
            });
            
            // 用户菜单
            document.getElementById('userMenuBtn').addEventListener('click', toggleUserMenu);
            
            // 登录表单
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            
            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            
            // 点击外部关闭菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#userMenuBtn') && !e.target.closest('#userMenu')) {
                    document.getElementById('userMenu').classList.add('hidden');
                }
            });
        }

        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.remove('lg:ml-64');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.add('lg:ml-64');
            }
        }

        // 切换用户菜单
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }

        // 加载页面
        function loadPage(page) {
            // 隐藏所有页面
            document.querySelectorAll('.page-content').forEach(p => {
                p.classList.add('hidden');
            });
            
            // 显示目标页面
            const targetPage = document.getElementById(page + '-page');
            if (targetPage) {
                targetPage.classList.remove('hidden');
                targetPage.classList.add('fade-in');
            }
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('bg-gray-100', 'text-blue-600');
            });
            
            const activeItem = document.querySelector(`[data-page="${page}"]`);
            if (activeItem) {
                activeItem.classList.add('bg-gray-100', 'text-blue-600');
            }
            
            // 更新页面标题
            const titles = {
                dashboard: '仪表板',
                products: '商品管理',
                inventory: '仓库管理',
                orders: '订单管理',
                users: '用户管理',
                analytics: '数据分析',
                settings: '系统设置'
            };
            
            document.getElementById('pageTitle').textContent = titles[page] || '仪表板';
            currentPage = page;
            
            // 加载页面内容
            loadPageContent(page);
        }

        // 加载页面内容
        function loadPageContent(page) {
            const container = document.getElementById(page + '-page');
            
            switch(page) {
                case 'products':
                    loadProductsPage(container);
                    break;
                case 'inventory':
                    loadInventoryPage(container);
                    break;
                case 'orders':
                    loadOrdersPage(container);
                    break;
                case 'users':
                    loadUsersPage(container);
                    break;
                case 'analytics':
                    loadAnalyticsPage(container);
                    break;
                case 'settings':
                    loadSettingsPage(container);
                    break;
            }
        }

        // 处理登录
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 模拟登录
            if (email && password) {
                localStorage.setItem('admin_token', 'mock_token_' + Date.now());
                isLoggedIn = true;
                document.getElementById('loginModal').classList.add('hidden');
                showNotification('登录成功！', 'success');
            } else {
                showNotification('请填写完整的登录信息', 'error');
            }
        }

        // 处理退出登录
        function handleLogout() {
            localStorage.removeItem('admin_token');
            isLoggedIn = false;
            document.getElementById('loginModal').classList.remove('hidden');
            showNotification('已退出登录', 'info');
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-md shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' :
                type === 'error' ? 'bg-red-500 text-white' :
                'bg-blue-500 text-white'
            }`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 加载商品管理页面
        function loadProductsPage(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">商品管理</h2>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            <i class="fas fa-plus mr-2"></i>添加商品
                        </button>
                    </div>
                    
                    <!-- 搜索和筛选 -->
                    <div class="bg-white rounded-lg shadow p-6 mb-6">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input type="text" placeholder="搜索商品..." class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <select class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option>所有分类</option>
                                <option>红酒</option>
                                <option>威士忌</option>
                                <option>白酒</option>
                            </select>
                            <select class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option>所有稀有度</option>
                                <option>普通</option>
                                <option>稀有</option>
                                <option>史诗</option>
                                <option>传说</option>
                            </select>
                            <button class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700">
                                <i class="fas fa-search mr-2"></i>搜索
                            </button>
                        </div>
                    </div>
                    
                    <!-- 商品列表 -->
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">商品</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分类</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">价格</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">库存</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <img class="h-10 w-10 rounded-full" src="/images/nftred-wine-nft.jpg" alt="">
                                            <div class="ml-4">
                                                <div class="text-sm font-medium text-gray-900">希漫红酒</div>
                                                <div class="text-sm text-gray-500">稀有</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">红酒</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">0.8 ETH</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">100</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">上架</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                        <button class="text-blue-600 hover:text-blue-900 mr-3">编辑</button>
                                        <button class="text-red-600 hover:text-red-900">删除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 加载仓库管理页面
        function loadInventoryPage(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">仓库管理</h2>
                        <button class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                            <i class="fas fa-plus mr-2"></i>入库
                        </button>
                    </div>
                    
                    <!-- 库存统计 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                                    <i class="fas fa-box text-xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm font-medium text-gray-600">总库存</p>
                                    <p class="text-2xl font-semibold text-gray-900">1,234</p>
                                </div>
                            </div>
